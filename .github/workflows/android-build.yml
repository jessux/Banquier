name: Build Android APK

# Compile un APK debug de Banquier pour Android. Nécessaire car l'environnement
# de développement habituel n'a pas le SDK Android installé — c'est cette CI qui
# produit le seul .apk téléchargeable.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'src/main/memory.ts'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'src/main/memory.ts'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la pre-release à créer (laisser vide pour un nom auto-généré)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Type check mobile module
        run: npm run typecheck:mobile

      - name: Build web assets + sync Capacitor
        run: npm run build:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: banquier-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Déclenché manuellement (workflow_dispatch) ou via android-release.yml
      # (workflow_call, sur un push de tag) : publie l'APK sur une pre-release
      # GitHub, pour un lien de téléchargement stable et direct (contrairement
      # à l'artefact CI, qui expire et nécessite d'être connecté).
      - name: Publish pre-release with APK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('android-preview-{0}', github.run_number) }}
          name: Banquier Android (pre-release) — build ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK de test (build debug, non signé) — généré automatiquement depuis `${{ github.sha }}`.

            Couvre les Phases 1-3 du portage Android : cœur hors-ligne (comptes, transactions,
            import CSV, catégories, règles, budgets, dashboard), IA (catégorisation + chat),
            synchronisation bancaire Powens (non testée en conditions réelles — voir docs/mobile.md).

            ⚠️ Build de test, non signé pour la production. Android peut demander d'autoriser
            l'installation depuis une source inconnue.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
