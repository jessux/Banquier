name: Build Installers

# Construit les exécutables Windows / macOS / Linux et les attache à une release.
# Appelé par le workflow Release Please après création d'une release, ou
# déclenché manuellement (workflow_dispatch) pour (re)générer les binaires
# d'un tag existant.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag de la release sur laquelle attacher les binaires
        required: true
        type: string
      ref:
        description: 'Ref git à compiler (défaut : le tag)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release sur laquelle attacher les binaires
        required: true
        type: string
      ref:
        description: 'Ref git à compiler (défaut : le tag)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # npm ci échoue de temps en temps sur une 503 transitoire du registre npm
      # (déjà vu planter la jambe linux d'une release alors que win/mac
      # passaient) — on retente 3 fois avant d'abandonner. `shell: bash`
      # explicite : le matrix inclut windows-latest, dont le shell par défaut
      # (pwsh) ne comprend pas cette syntaxe.
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci a échoué (tentative $i/3), nouvel essai dans 15s..." >&2
            sleep 15
          done
          exit 1

      - name: Build app
        run: npm run build
        env:
          POWENS_CLIENT_ID: ${{ secrets.POWENS_CLIENT_ID }}
          POWENS_CLIENT_SECRET: ${{ secrets.POWENS_CLIENT_SECRET }}

      # Publie les installeurs ET les métadonnées de mise à jour
      # (latest.yml / latest-mac.yml / latest-linux.yml + blockmaps) sur la
      # release du tag courant. Ces fichiers sont indispensables à
      # electron-updater pour détecter et télécharger les nouvelles versions.
      - name: Package & publish installer
        run: npx --no-install electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds non signés : on désactive la découverte de certificat macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: false
